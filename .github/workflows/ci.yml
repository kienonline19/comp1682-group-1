# =============================================================================
# CI Pipeline - runs on every pull request and every push to main
# Purpose: install dependencies and run the automated tests
#
# This file is pre-configured. Your tasks:
#   1. Fix the 6 bugs in backend/server.js so all 7 backend tests pass
#   2. Uncomment the Frontend section below once `npm test` passes locally
#      in frontend/
#   3. (Task 5) Add the check named "test" as a required status check in the
#      branch protection rule for main
#
# See: Lab 3 - Continuous Integration with GitHub Actions
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL database for the integration tests.
    # It starts EMPTY - the schema is loaded in a step below.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bugdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bugpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bugdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # -- Backend ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The service container is an empty database, so create the tables first.
      # (In docker compose this file is mounted into /docker-entrypoint-initdb.d.)
      - name: Load database schema
        env:
          PGPASSWORD: bugpassword
        run: psql -h localhost -U postgres -d bugdb -f database/database.sql

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: bugdb
          DB_USER: postgres
          DB_PASSWORD: bugpassword
          PORT: 8080
        run: npm test

      # -- Frontend -----------------------------------------------------------
      # STUDENT TODO: uncomment this section to run frontend tests in CI.
      # Do this after `npm test` passes locally in the frontend/ directory.
      #
      - name: Set up Node.js (frontend cache)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
